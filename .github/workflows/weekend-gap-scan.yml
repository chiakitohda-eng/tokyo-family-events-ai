name: Weekend gap scan (read only)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "対象の土曜日 YYYY-MM-DD(空欄=次の土曜日)"
        required: false
        type: string

permissions:
  contents: write   # gap-scan-results ブランチへの結果保存のみ(本番・データ・mainは触らない)

concurrency:
  group: weekend-gap-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_weekend_gap_scan.py' -v
      - name: Scan official sources for the target weekend
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          python3 tools/weekend_gap_scan.py "${args[@]}" --output-dir "$RUNNER_TEMP/gap-scan"
      - name: Show benchmark in the log
        if: always()
        run: |
          column -t -s $'\t' "$RUNNER_TEMP/gap-scan/benchmark.tsv" || true
          echo; head -c 3000 "$RUNNER_TEMP/gap-scan/summary.json" || true
      - name: Save results to the gap-scan-results branch (candidate worklist only)
        if: always()
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/gap-scan"
          pub="$RUNNER_TEMP/pub"
          rm -rf "$pub"; mkdir -p "$pub/latest"
          for f in summary.json benchmark.tsv hits.tsv hits.json requests.json; do
            [ -f "$d/$f" ] && cp "$d/$f" "$pub/latest/$f" || true
          done
          cd "$pub"
          git init -q
          git checkout -q -b gap-scan-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "gap scan results $(date -u +%FT%TZ) run ${{ github.run_id }}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gap-scan-results
          echo "Saved to branch gap-scan-results (latest/)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekend-gap-scan
          path: ${{ runner.temp }}/gap-scan/
          retention-days: 30
          if-no-files-found: warn
