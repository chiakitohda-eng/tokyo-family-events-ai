name: Verify pending and completed status separation
on:
  # Historical frozen candidate: live branch SHAs intentionally reflect its pre-release state.
  # Current changes run remaining-evidence-review (npm regression + current exact data gate).
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  status-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          path: scanner
      - uses: actions/checkout@v4
        with:
          ref: 5f2ad98c8f8e18c0f25eb72bcac00cc0335feccf
          path: candidate
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Staging tests
        working-directory: scanner
        run: npm test
      - name: Exact approved paths and preserved event data
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=48ea14ef33d762958448ab562fd1d5f1ae4c834e
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          git diff --name-only "$BASE" HEAD | sort > /tmp/actual-paths.txt
          printf '%s\n' site/audit/pending_issues_catalog.json site/pending-issues-model.mjs site/pending-issues.css site/pending-issues.html site/pending-issues.js tests/pending_issues_release.test.mjs | sort > /tmp/expected-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          git diff --quiet "$BASE" HEAD -- site/data site/app.js site/search.html site/copy.html site/index.html prompts policy analytics tools
          test "$(git ls-remote origin refs/heads/data-production | cut -f1)" = "847e388e65b99e38a0f108ecc96009778b3fdcd2"
          test "$(git ls-remote origin refs/heads/data-staging | cut -f1)" = "847e388e65b99e38a0f108ecc96009778b3fdcd2"
      - name: Production candidate regression and real load failure
        working-directory: candidate
        run: |
          node --check site/pending-issues.js
          npm test
