              --base-ref "$BASE"
          elif [ "$OP" = "provenance-fill-20261120" ]; then
            python3 staging-policy-src/tools/validate_provenance_fill_20261120.py \
              --data-dir site/data \
              --base-ref "$BASE"
          elif [ "$OP" = "image-fill4-20261122" ]; then
            python3 staging-policy-src/tools/validate_image_fill4_20261122.py \
              --data-dir site/data \
              --base-ref "$BASE"
          elif [ "$OP" = "image-fill3-20261120" ]; then
