              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [[ "$OP" =~ ^verified-lead(2[0-9]|[3-9][0-9])-addition-20261121$ ]]; then
            python3 "staging-policy-src/tools/validate_lead${BASH_REMATCH[1]}_addition_20261121.py" \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead17-addition-20261120" ]; then
            python3 staging-policy-src/tools/validate_lead17_addition_20261120.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead16-addition-20261120" ]; then
            python3 staging-policy-src/tools/validate_lead16_addition_20261120.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead15-addition-20261120" ]; then
