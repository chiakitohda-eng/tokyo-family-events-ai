          elif [ "$OP" = "nakano-image-alignment-20261120" ]; then
            python3 staging-policy-src/tools/validate_nakano_image_alignment_20261120.py \
              --data-dir site/data \
              --base-ref "$BASE"
          elif [ "$OP" = "sumida-image-alignment-20261120" ]; then
            python3 staging-policy-src/tools/validate_sumida_image_alignment_20261120.py \
              --data-dir site/data \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead41-addition-20261122" ]; then
            python3 staging-policy-src/tools/validate_lead41_addition_20261122.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead42-addition-20261122" ]; then
            python3 staging-policy-src/tools/validate_lead42_addition_20261122.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead43-addition-20261123" ]; then
            python3 staging-policy-src/tools/validate_lead43_addition_20261123.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead44-addition-20261123" ]; then
