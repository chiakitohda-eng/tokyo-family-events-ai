              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead12-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_lead12_addition_20261119.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead11-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_lead11_addition_20261119.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead10-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_lead10_addition_20261119.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead9-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_lead9_addition_20261119.py \
              --data-dir site/data \
