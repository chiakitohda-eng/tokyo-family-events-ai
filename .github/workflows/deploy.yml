name: Validate Staging and Publish Preview

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/**'
      - 'tests/**'
      - 'prompts/**'
      - 'package.json'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '.github/release-trigger.txt'
      - '.github/data-deploy-trigger.txt'
      - '.github/production-releases.json'

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      candidate_sha: ${{ steps.gate.outputs.candidate_sha }}
      base_data_production_sha: ${{ steps.gate.outputs.base_data_production_sha }}
      operation: ${{ steps.gate.outputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: gate
        shell: bash
        run: |
          mode="staging"
          candidate=""
          base=""
          operation=""

          if [ "${{ github.event_name }}" = "push" ]; then
            changed="$(git diff --name-only HEAD^ HEAD)"
            count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$count" = "1" ] && printf '%s\n' "$changed" | grep -Fxq '.github/data-deploy-trigger.txt'; then
              mode="data"
              candidate="$(sed -n 's/^candidate_sha=//p' .github/data-deploy-trigger.txt | tail -1)"
              base="$(sed -n 's/^base_data_production_sha=//p' .github/data-deploy-trigger.txt | tail -1)"
              operation="$(sed -n 's/^operation=//p' .github/data-deploy-trigger.txt | tail -1)"
              if ! printf '%s' "$candidate" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Invalid candidate_sha in data deploy trigger" >&2
                exit 1
              fi
              if ! printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'; then
                echo "Invalid base_data_production_sha in data deploy trigger" >&2
                exit 1
              fi
            fi
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "candidate_sha=$candidate" >> "$GITHUB_OUTPUT"
          echo "base_data_production_sha=$base" >> "$GITHUB_OUTPUT"
          echo "operation=$operation" >> "$GITHUB_OUTPUT"

  validate_staging:
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'staging' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and validate canonical prompt governance
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate non-regression against previous published data
        run: python tools/validate_non_regression.py --base-ref HEAD^ site/data
      - name: Block every unapproved removal of previously published events
        run: python tools/validate_protected_events.py --base-ref HEAD^ site/data
      - name: Enrich thumbnail URLs for validation only
        run: python tools/enrich_images.py site/data
      - name: Audit event-specific images on multi-event official pages
        run: |
          python tools/audit_event_image_identity.py site/data --strict
          python -m unittest discover -s tests -p 'test_event_image_identity.py'
      - name: Validate event data strictly
        run: python tools/validate_data.py --strict --min-image-coverage 0 site/data
      - name: Validate family-fit decision audit strictly
        run: python tools/validate_decisions.py --strict site/data
      - name: Validate v1.6 exclusion rereview
        run: python tools/validate_rereview.py --strict site/data
      - name: Validate official schedule discovery evidence
        run: python tools/validate_official_schedule_audit.py site/data
      - name: Test copy contract and shared filters
        run: npm test
      - name: Classify intentional staging-only differences (never auto-approve new ones)
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p 'test_environment_diff_policy.py'
          python3 tools/audit_environment_diff.py --fetch --ref HEAD --base origin/production

  validate_data:
    needs: gate
    if: ${{ needs.gate.outputs.mode == 'data' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Checkout released application
        uses: actions/checkout@v4
        with:
          ref: production
          path: production-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm candidate belongs to data-staging
        shell: bash
        run: |
          git fetch origin data-staging --depth=1
          expected="$(git rev-parse origin/data-staging)"
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "Candidate SHA is not the current data-staging head" >&2
            exit 1
          fi
      - name: Confirm production-data base has not moved
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/data-production | awk '{print $1}')"
          expected="${{ needs.gate.outputs.base_data_production_sha }}"
          if [ "$current" != "$expected" ]; then
            echo "data-production moved: expected $expected but found $current" >&2
            exit 1
          fi
      - name: Validate released prompt governance
        working-directory: production-src
        run: node .github/scripts/validate-prompt-history.mjs
      - name: Validate data non-regression against current production data
        if: ${{ needs.gate.outputs.operation != 'history-provenance-only-20261108' }}
        run: python production-src/tools/validate_non_regression.py --base-ref ${{ needs.gate.outputs.base_data_production_sha }} site/data
      - name: Overlay released static data policy for validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import re

          src = Path("production-src/site/data")
          dst = Path("site/data")
          runtime = re.compile(r"^20\d{2}-\d{2}-\d{2}.*\.json$")

          for p in src.iterdir():
              if not p.is_file():
                  continue
              if runtime.match(p.name) or p.name in {"manifest.json", "update_history.json"}:
                  continue
              shutil.copy2(p, dst / p.name)
          PY
      - name: Preserve frozen candidate data during validation
        run: echo 'Use existing staged image URLs; image coverage is checked strictly without modifying event files'
      - name: Validate candidate event data strictly
        run: python production-src/tools/validate_data.py --strict --min-image-coverage 0 site/data
      - name: Validate candidate family-fit decisions strictly
        run: python production-src/tools/validate_decisions.py --strict site/data
      - name: Validate candidate rereview strictly
        run: python production-src/tools/validate_rereview.py --strict site/data
      - name: Checkout staging audit policy
        uses: actions/checkout@v4
        with:
          ref: main
          path: staging-policy-src
      - name: Require individual evidence for every new or changed family-fit assessment
        run: python3 staging-policy-src/tools/validate_family_fit_quality.py --base-ref ${{ needs.gate.outputs.base_data_production_sha }} --data-dir site/data
      - name: Download immutable 2026-10-26 source evidence for verified horizon subset
        if: ${{ needs.gate.outputs.operation == 'verified-horizon-subset' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 12621285469
          run-id: 40239302863
          github-token: ${{ github.token }}
          path: original-audit-evidence
      - name: Download immutable 2026-11-08 source evidence for current horizon rollover
        if: ${{ needs.gate.outputs.operation == 'verified-current-rollover' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 13607681119
          run-id: 42456012607
          github-token: ${{ github.token }}
          path: current-rollover-evidence
      - name: Prove immutable event data and 5 newly added history IDs
        if: ${{ needs.gate.outputs.operation == 'history-provenance-only-20261108' }}
        run: node staging-policy-src/tools/validate_history_metadata_provenance.mjs --base-ref ${{ needs.gate.outputs.base_data_production_sha }} --data-dir site/data
      - name: Audit image-to-event assignment before data promotion
        run: |
          python staging-policy-src/tools/audit_event_image_identity.py site/data --strict
          python -m unittest discover -s staging-policy-src/tests -p 'test_event_image_identity.py'
      - name: Prevent historical event removal without user approval
        if: ${{ needs.gate.outputs.operation != 'history-provenance-only-20261108' }}
        run: python staging-policy-src/tools/validate_protected_events.py --base-ref ${{ needs.gate.outputs.base_data_production_sha }} site/data
      - name: Prove the exact one-field thumbnail-only correction
        if: ${{ needs.gate.outputs.operation == 'thumbnail-correction' }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          baseline = "${{ needs.gate.outputs.base_data_production_sha }}"
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", baseline, "HEAD"], text=True
          ).splitlines()
          path = "site/data/2026-10-24-events-01.json"
          if changed != [path]:
              raise SystemExit(f"THUMBNAIL-ONLY GUARD: expected only {path}, got {changed!r}")
          before = json.loads(subprocess.check_output(
              ["git", "show", f"{baseline}:{path}"], text=True
          ))
          after = json.loads(Path(path).read_text(encoding="utf-8"))
          if len(before) != len(after):
              raise SystemExit("THUMBNAIL-ONLY GUARD: event count changed")
          target_id = "v15-16abce941248"
          old = "https://www.koho.metro.tokyo.lg.jp/2026/10/images/202610_moyoshi14_07.png"
          new = "https://www.koho.metro.tokyo.lg.jp/2026/10/images/202610_moyoshi14_06.jpg"
          touched = []
          for a, b in zip(before, after):
              if a.get("id") != b.get("id"):
                  raise SystemExit("THUMBNAIL-ONLY GUARD: event order or ID changed")
              if a != b:
                  touched.append(a.get("id"))
                  expect = dict(a)
                  expect["image"] = new
                  if a.get("id") != target_id or a.get("image") != old or b != expect:
                      raise SystemExit("THUMBNAIL-ONLY GUARD: unauthorized record or field change")
          if touched != [target_id]:
              raise SystemExit(f"THUMBNAIL-ONLY GUARD: changed event ids {touched!r}")
          print("THUMBNAIL-ONLY GUARD PASS: one evidence-backed image URL correction; all other files/records intact")
          PY
      - name: Validate candidate official schedule discovery evidence
        if: ${{ needs.gate.outputs.operation != 'thumbnail-correction' }}
        shell: bash
        env:
          OP: ${{ needs.gate.outputs.operation }}
          BASE: ${{ needs.gate.outputs.base_data_production_sha }}
        run: |
          if [ "$OP" = "verified-nine-followup-20261115" ]; then
            python3 staging-policy-src/tools/validate_nine_followup_addition_20261115.py               --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-all-remaining-evidence-20261115" ]; then
            python3 staging-policy-src/tools/validate_all_remaining_evidence_20261115.py               --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-remaining-evidence-20261115" ]; then
            python3 staging-policy-src/tools/validate_remaining_evidence_addition_20261115.py               --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-pending-data-20261115" ]; then
            python3 staging-policy-src/tools/validate_pending_data_release_20261115.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-all-non-tamemap-20261114" ]; then
            python3 staging-policy-src/tools/validate_all_non_tamemap_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-non-tamemap-last-20261114" ]; then
            python3 staging-policy-src/tools/validate_non_tamemap_last_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-non-tamemap-next-20261114" ]; then
            python3 staging-policy-src/tools/validate_non_tamemap_next_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "older-family-fit-correction-20261114" ]; then
            python3 staging-policy-src/tools/validate_older_family_fit_correction.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-non-tamemap-20261114" ]; then
            python3 staging-policy-src/tools/validate_non_tamemap_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "weekly-family-fit-correction-20261114" ]; then
            python3 staging-policy-src/tools/validate_weekly_family_fit_correction.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "rail-family-fit-correction-20261114" ]; then
            python3 staging-policy-src/tools/validate_rail_family_fit_correction.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-additional-primary-20261114" ]; then
            python3 staging-policy-src/tools/validate_additional_primary_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-final-backlog-20261114" ]; then
            python3 staging-policy-src/tools/validate_final_backlog_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-community-review-20261113" ]; then
            python3 staging-policy-src/tools/validate_community_review_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-hiromachi-review-20261113" ]; then
            python3 staging-policy-src/tools/validate_hiromachi_review_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-nakano-review-20261113" ]; then
            python3 staging-policy-src/tools/validate_nakano_review_addition.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "verified-somei-20261109" ]; then
            python3 staging-policy-src/tools/validate_somei_add_20261109.py \
              --base-ref "$BASE" --data-dir site/data
            echo 'Individual ward official verified, old crawl failures remain recorded.'
          elif [ "$OP" = "verified-zoo-20261108" ]; then
            python3 staging-policy-src/tools/validate_zoo_add_20261108.py \
              --base-ref "$BASE" --data-dir site/data
            echo 'Zero old event records changed; original audit debt left open.'
          elif [ "$OP" = "verified-two-official-omissions-20261108" ]; then
            python3 staging-policy-src/tools/validate_two_official_omissions_20261108.py \
              --base-ref "$BASE" --data-dir site/data
            echo 'No old source failure was changed, and the 859 remaining candidate links are not marked audited.'
          elif [ "$OP" = "manual-official-verified-subset-20261117" ]; then
            python3 staging-policy-src/tools/validate_manual_20261117_verified_subset.py \
              --base-ref "$BASE" --data-dir site/data
          elif [ "$OP" = "history-provenance-only-20261108" ]; then
            node staging-policy-src/tools/validate_history_metadata_provenance.mjs \
              --base-ref "$BASE" --data-dir site/data
            echo 'Historical source audit debt unchanged; no candidate-level verification claimed.'
          elif [ "$OP" = "verified-forest-table-addition" ]; then
            python3 staging-policy-src/tools/validate_nerima_forest_addition.py \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-horizon-subset" ]; then
            python3 staging-policy-src/tools/validate_verified_horizon_rollover.py \
              --data-dir site/data \
              --main-dir staging-policy-src \
              --evidence-dir original-audit-evidence/holiday-after-source-evidence \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-audit-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_audit_addition_20261119.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead5-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_lead5_addition_20261119.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead6-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_lead6_addition_20261119.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "verified-lead7-addition-20261119" ]; then
            python3 staging-policy-src/tools/validate_lead7_addition_20261119.py \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-19-audit/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [[ "$OP" =~ ^verified-(lead(1[89]|2[0-9]))-addition-20261120$ ]]; then
            python3 "staging-policy-src/tools/validate_${BASH_REMATCH[1]}_addition_20261120.py" \
              --data-dir site/data \
              --pages-dir staging-policy-src/research/2026-11-20-thin-wards/pages \
              --tools-dir staging-policy-src/tools \
              --base-ref "$BASE"
          elif [ "$OP" = "nerima-duplicate-removal-20261120" ]; then
            python3 staging-policy-src/tools/validate_nerima_duplicate_removal_20261120.py \
              --data-dir site/data \
              --base-ref "$BASE"
          elif [ "$OP" = "provenance-fix2-20261120" ]; then
            python3 staging-policy-src/tools/validate_provenance_fix2_20261120.py \
              --data-dir site/data \
              --base-ref "$BASE"
          elif [ "$OP" = "provenance-fix-20261120" ]; then
            python3 staging-policy-src/tools/validate_provenance_fix_20261120.py \
